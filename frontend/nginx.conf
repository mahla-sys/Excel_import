# In production behind Caddy (deploy/Caddyfile), Caddy is the public
# reverse proxy and handles TLS + /api routing to the backend, so this
# block is redundant but harmless (Caddy proxies /api/*, /admin/*,
# /static/* directly to the backend container before nginx ever sees
# them). It is REQUIRED when this container is reached directly
# (e.g. docker-compose.yml for local/dev use without Caddy) — without
# it, requests to /api/... fall through to try_files and get index.html
# back instead of JSON, which breaks every page that calls the API.
#
# "backend" resolves via Docker's internal DNS to the backend service
# defined in docker-compose.yml / docker-compose.prod.yml.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
